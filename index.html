<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A CSS hover-scroll reveal effect.">
    <title>Hover Scroll</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1 class="title">Hover Scroll</h1>
    <div class="grid">
        <div class="container">
            <div class="main">
                <div class="slidersec">
                    <h2>Hello World</h2>
                    <p>Hover this card to slide up and reveal the panel underneath.</p>
                </div>
                <div class="slidersec">
                    <h2>Bye World</h2>
                    <p>This is the second panel that shows on hover.</p>
                </div>
            </div>
            <div class="cursor"><div class="circle"></div></div>
        </div>
        <div class="container teal">
            <div class="main">
                <div class="slidersec">
                    <h2>Teal Card</h2>
                    <p>The same effect with a different colour scheme.</p>
                </div>
                <div class="slidersec">
                    <h2>Revealed</h2>
                    <p>Each card slides on its own hover.</p>
                </div>
            </div>
            <div class="cursor"><div class="circle"></div></div>
        </div>
    </div>
</body>

</html>
